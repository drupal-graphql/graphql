version = "1"
# The lowest PHP version that the supported core releases accept.
php-version = "8.1"
extends = "vendor/drupal/mago/drupal.mago.toml"

[source]
paths = ["examples", "graphql*", "src", "tests"]
includes = ["vendor", "web"]
excludes = [
  ".ddev",
  "vendor/*/Tests/*",
  "vendor/*/tests/*",
  "web/modules/custom/graphql",
]

[linter]
# Stops `lowercase-keyword` from reporting TRUE, FALSE and NULL.
integrations = ["drupal", "phpunit"]
# Fail on anything, the same way phpcs does.
minimum-fail-level = "note"

[linter.rules]
assertion-style = { style = "this" }
# Report a file whose name differs from the class that it declares.
file-name = { enabled = true }
# Accept snake_case functions and camelCase methods. Hook documentation has
# uppercase placeholders such as hook_ENTITY_TYPE_insert().
function-name = { either = true, exclude = ["*.api.php"] }
# Report a variable that is assigned and never read.
no-redundant-variable = { enabled = true }
# Code complexity checks are tuned to what we like in this code base.
cyclomatic-complexity = { enabled = true, threshold = 30 }
excessive-parameter-list = { enabled = true, constructor-threshold = 13, threshold = 8 }
halstead = { enabled = true, difficulty-threshold = 13 }
kan-defect = { enabled = true, threshold = 2.1 }
too-many-methods = { enabled = true, threshold = 15 }
too-many-properties = { enabled = true }

# These rules contradict Drupal's standard.
no-error-control-operator = { enabled = false }

# Advice that Drupal's standard does not ask for.
assert-description = { enabled = false }
braced-string-interpolation = { enabled = false }
identity-comparison = { enabled = false }
literal-named-argument = { enabled = false }
no-assign-in-condition = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
no-else-clause = { enabled = false }
no-empty = { enabled = false }
no-empty-catch-clause = { enabled = false }
no-isset = { enabled = false }
no-multi-assignments = { enabled = false }
no-shorthand-ternary = { enabled = false }
prefer-arrow-function = { enabled = false }
prefer-early-continue = { enabled = false }
strict-behavior = { enabled = false }


[analyzer]
plugins = ["phpstan-ignores"]
ignore = [
  # Test classes may keep entity storage in properties.
  { code = "drupal/entity-storage-property", in = [
    "tests/",
  ] },
  # We often get services from the container where the return type is mixed.
  # @todo needs a Drupal or Symfony plugin?
  "ambiguous-object-method-access",
  # Same as ambiguous-object-method-access.
  { code = "less-specific-argument", pattern = "::__construct`: expected `.+`, but provided type `null\\|object`" },
  # Plugin definition arrays can be passed around as mixed.
  { code = "mixed-argument", pattern = "::__construct" },
  # We pass mixed arguments all the time in Drupal, is this even solvable?
  "mixed-argument",
  # We use mixed array types all over the place in Drupal, probably not fixable.
  "mixed-array-access",
  # We do mixed assignments all the time in Drupal, is this even solvable?
  "mixed-assignment",
  "mixed-operand",
  # We do mixed property access all the time in Drupal, is this even solvable?
  "mixed-property-access",
  # We need to support attributes between different Drupal versions that might
  # not exist.
  "non-existent-attribute-class",
  "redundant-docblock-type",
  # Same container service problem as for "ambiguous-object-method-access".
  #"possible-method-access-on-null",
  # Same container service problem as for "ambiguous-object-method-access".
  { code = "possibly-null-argument", pattern = "::__construct` is possibly `null`" },
  # new static() is a best practice in Drupal.
  { code = "unsafe-instantiation", pattern = "new static()" },
]
