################
# Uses the GitLabCI template for Drupal projects.
# The full documentation is on https://project.pages.drupalcode.org/gitlab_templates/
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  SKIP_ESLINT: 1
  SKIP_STYLELINT: 1
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  OPT_IN_TEST_PREVIOUS_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_MAX_PHP: 1
  _COMPOSER_YARN_INSTALL: 0
  _PHPUNIT_CONCURRENT: 1

composer (next major):
  variables:
    _LENIENT_ALLOW_LIST: typed_data,entity_reference_revisions

phpunit (next major):
  variables:
    # Do not fail on deprecations on Drupal 12 because we need to support
    # Drupal 11.
    _RUNTESTS_EXTRA: '--suppress-deprecations'

# Mago lint with the Drupal rules from amateescu/mago-drupal. The composer job
# installs both from require-dev, and mago.toml in the module root holds the
# configuration. The second run writes the GitLab code quality report.
mago-lint:
  stage: validate
  needs: [composer]
  rules:
    - if: $SKIP_MAGO == "1"
      when: never
    - when: on_success
  allow_failure: false
  script:
    - cd $CI_PROJECT_DIR && pwd
    - $COMPOSER_BIN_DIR/mago version
    - $COMPOSER_BIN_DIR/mago extension list
    - $COMPOSER_BIN_DIR/mago lint || EXIT_CODE=$?
    - $COMPOSER_BIN_DIR/mago lint --reporting-format gitlab > mago-codequality.json || true
    - exit ${EXIT_CODE:-0}
  artifacts:
    expire_in: 1 mos
    when: always
    name: artifacts-$CI_PIPELINE_ID-$CI_JOB_NAME_SLUG
    paths:
      - mago-codequality.json
    reports:
      codequality: mago-codequality.json
